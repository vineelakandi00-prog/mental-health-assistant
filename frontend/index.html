<!DOCTYPE html>
<html>
<head>
  <title>Mental Health Assistant</title>
</head>
<body>
  <h1>Mental Health Assistant</h1>
  <textarea id="userText" rows="4" cols="50" placeholder="Type how you feel..."></textarea><br>
  <button onclick="analyzeText()">Analyze</button>

  <div id="result"></div>

  <script>
    async function analyzeText() {
      const text = document.getElementById("userText").value;
      const response = await fetch("http://127.0.0.1:5000/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      const data = await response.json();
      document.getElementById("result").innerHTML =
        "<p><strong>Emotion:</strong> " + data.emotion + "</p>" +
        "<p><strong>Suggested Resource:</strong> " + data.suggested_resource + "</p>";
    }
  </script>
</body>
</html>
