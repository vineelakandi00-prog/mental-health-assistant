<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mental Health Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    textarea { width: 100%; height: 100px; }
    button { margin-top: 10px; padding: 10px 20px; }
    .result { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Mental Health Assistant</h1>
  <p>Type how you feel:</p>
  <textarea id="userInput"></textarea><br>
  <button onclick="sendText()">Analyze</button>

  <div class="result" id="result"></div>

  <script>
    async function sendText() {
      const text = document.getElementById("userInput").value;
      const response = await fetch("http://127.0.0.1:5000/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      const data = await response.json();
      document.getElementById("result").innerText =
        `Emotion: ${data.emotion}\nStrategy: ${data.strategy}`;
    }
  </script>
</body>
</html>
